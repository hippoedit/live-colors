name: Diagnose Current Plugin Package Download

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  diagnose:
    if: contains(github.event.head_commit.message, '[diagnose-live-colors-download]')
    runs-on: ubuntu-24.04
    steps:
      - name: Probe package endpoint variants
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            label="$1"
            url="$2"
            shift 2
            headers=$(mktemp)
            status=$(curl --location --silent --show-error --output /dev/null --dump-header "$headers" --write-out '%{http_code}' "$@" "$url" || true)
            echo "=== $label ==="
            echo "status=$status"
            grep -Ei '^(server|cf-ray|location|content-type|x-|retry-after):' "$headers" || true
            rm -f "$headers"
          }
          probe 'www-default' 'https://www.hippoedit.com/download/plugins/live_colors/package-info.xml'
          probe 'apex-default' 'https://hippoedit.com/download/plugins/live_colors/package-info.xml'
          probe 'www-browser-ua' 'https://www.hippoedit.com/download/plugins/live_colors/package-info.xml' --user-agent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154.0 Safari/537.36'
          probe 'www-github-ua' 'https://www.hippoedit.com/download/plugins/live_colors/package-info.xml' --user-agent 'HippoEDIT-GitHub-Actions/1.0'
