name: Import Current Plugin Package

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  import:
    if: contains(github.event.head_commit.message, '[import-live-colors-package]')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download current package payload
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.hippoedit.com/download/plugins/live_colors'
          root='dist/plugin'
          ua='HippoEDIT-GitHub-Actions/1.0'
          rm -rf "$root"
          mkdir -p "$root/x32" "$root/x32u" "$root/x64"
          curl --fail --location --silent --show-error --retry 3 --user-agent "$ua" "$base/package-info.xml" -o "$root/package-info.xml"
          curl --fail --location --silent --show-error --retry 3 --user-agent "$ua" "$base/x32/LiveColors.dll" -o "$root/x32/LiveColors.dll"
          curl --fail --location --silent --show-error --retry 3 --user-agent "$ua" "$base/x32/livecolors.pdb.zip" -o "$root/x32/livecolors.pdb.zip"
          curl --fail --location --silent --show-error --retry 3 --user-agent "$ua" "$base/x32u/LiveColors.dll" -o "$root/x32u/LiveColors.dll"
          curl --fail --location --silent --show-error --retry 3 --user-agent "$ua" "$base/x32u/livecolors.pdb.zip" -o "$root/x32u/livecolors.pdb.zip"
          curl --fail --location --silent --show-error --retry 3 --user-agent "$ua" "$base/x64/LiveColors.dll" -o "$root/x64/LiveColors.dll"
          curl --fail --location --silent --show-error --retry 3 --user-agent "$ua" "$base/x64/livecolors.pdb.zip" -o "$root/x64/livecolors.pdb.zip"

      - name: Verify exact legacy payload
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/live-colors.sha256 <<'EOF'
          7a2e45f45b57863824bf5051d580cb83cea2b03e03d6ae939f525ca19f81d4a5  dist/plugin/package-info.xml
          eeaab0279aed7a0ff350f463af2e40dc2f59ee0af4b2ec0f24f10868b99e5b26  dist/plugin/x32/LiveColors.dll
          b855a3343a4c4d808d5906c786abfa6f2654f241867146f9a1f2f0a5329c562b  dist/plugin/x32/livecolors.pdb.zip
          bc0f35469d8556b25052f5952596490a8f68d362e54e176d06b06dbf3d358019  dist/plugin/x32u/LiveColors.dll
          12c9d920f8c7726b981aa552d460ed2fc13c950c98659de8f612c206f0c3a718  dist/plugin/x32u/livecolors.pdb.zip
          716a2b93c1b47bb9b0029c2d8ade5a7d3a08d46877ab8aecc2db09c6b5b756e3  dist/plugin/x64/LiveColors.dll
          d5a51f0078ddfabddaecc6ab9eda5d48ff09314274ca55008b1a2484a17fc8f1  dist/plugin/x64/livecolors.pdb.zip
          EOF
          sha256sum --check /tmp/live-colors.sha256
          grep -q '<id>FC52F539-8F7A-4145-8E33-01E8371D82E2</id>' dist/plugin/package-info.xml
          grep -q '<version>1.0.0.8</version>' dist/plugin/package-info.xml

      - name: Commit imported distribution package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'HippoEDIT'
          git config user.email 'hippoedit@users.noreply.github.com'
          git add dist/plugin
          git diff --cached --quiet && exit 0
          git commit -m 'build: own current Live Colors plugin package'
          git push origin HEAD:master
